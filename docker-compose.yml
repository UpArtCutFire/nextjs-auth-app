
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth_app
      POSTGRES_USER: Underoath
      POSTGRES_PASSWORD: Tb4a872z-Tb4a872z-
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Underoath -d auth_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs-auth-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://Underoath:Tb4a872z-Tb4a872z-@postgres:5432/auth_app
      - NEXTAUTH_URL=https://appsidingpro.cl
      - NEXTAUTH_SECRET=Cotarola1988--
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

